<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#162241" />
    <title>Smart App PH Dashboard</title>
    <script>
      // Light or dark before the first paint, so the page never flashes the wrong theme.
      try {
        if (localStorage.getItem('smartapp-theme') === 'dark') document.documentElement.classList.add('dark');
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
